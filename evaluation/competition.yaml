version: 2
title: 2027 SoccerNet Group Activity Recognition Challenge
description: Classify soccer group activities from pixels, positions, or both.
image: banner.png
terms: pages/terms.md
registration_auto_approve: true
docker_image: python:3.12-slim
make_programs_available: false
make_input_data_available: false
can_participants_make_submissions_public: false
pages:
- title: Overview
  file: pages/overview.md
- title: Data
  file: pages/data.md
- title: Evaluation
  file: pages/evaluation.md
tasks:
- index: 0
  name: GAR classification
  scoring_program: scoring_program.zip
  reference_data: reference_data.zip
phases:
- index: 0
  name: Challenge
  start: '2026-10-07 00:00:00'
  end: '2027-04-26 12:00:00'
  tasks:
  - 0
  execution_time_limit: 600
  max_submissions_per_day: 5
  accepts_only_result_submissions: true
  hide_prediction_output: true
  starting_kit: starting_kit.zip
leaderboards:
- title: GAR results
  key: main
  submission_rule: Force_Best
